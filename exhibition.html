<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#d7c9b8"/>
<meta name="description" content="The Exhibition: Jew-Hatred through three eras."/>
<title>The Exhibition — STOPAZ</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link href="styles.css" rel="stylesheet"/>
</head>
<body class="exhibition-shell exhibition-museum-page" data-page="exhibition.html" data-music-on-interaction="true">
<a class="skip-link" href="#main">Skip to content</a>
<main class="museum-exhibition" id="main" tabindex="-1">
  <section class="museum-stage" aria-label="The Exhibition entrance">
    <div aria-hidden="true" class="museum-backdrop museum-backdrop-left"></div>
    <div aria-hidden="true" class="museum-backdrop museum-backdrop-right"></div>
    <div aria-hidden="true" class="museum-backdrop museum-backdrop-bottom"></div>
    <div aria-hidden="true" class="museum-speckle"></div>
    <div class="museum-frame">
      <a class="museum-return" href="index.html">Back to main site</a>
      <div class="museum-title-card">
        <div class="museum-title-image"></div>
        <h1>Jew-Hatred</h1>
      </div>
      <div class="museum-card-grid" role="navigation" aria-label="Exhibition eras">
        <a class="museum-card" href="#antijudaism">
          <img class="site-image pending-image" src="soviet_horses.webp" alt="Antijudaism" loading="lazy" decoding="async"/>
          <span>Antijudaism</span>
        </a>
        <a class="museum-card" href="#antisemitism">
          <img class="site-image pending-image" src="red_paint_door.webp" alt="Antisemitism" loading="lazy" decoding="async"/>
          <span>Antisemitism</span>
        </a>
        <a class="museum-card" href="antizionism.html">
          <img class="site-image pending-image" src="campus_encampment.webp" alt="Antizionism" loading="eager" decoding="async"/>
          <span>Antizionism</span>
        </a>
      </div>
    </div>
    <button class="music-control" type="button" aria-pressed="false" aria-label="Play exhibition music"><span>Music</span><i aria-hidden="true"></i></button>
    <audio id="room-audio" src="nocturne.mp3" loop preload="auto" autoplay></audio>
  </section>
  <section class="museum-era-panels" id="eras" aria-label="Three eras of Jew-Hatred">
    <article class="museum-era-panel" id="antijudaism">
      <div class="museum-era-number">I</div>
      <img class="site-image pending-image" src="soviet_horses.webp" alt="Antijudaism archive image" loading="lazy" decoding="async"/>
      <h2>Antijudaism</h2>
    </article>
    <article class="museum-era-panel" id="antisemitism">
      <div class="museum-era-number">II</div>
      <img class="site-image pending-image" src="protocols.webp" alt="Antisemitism archive image" loading="lazy" decoding="async"/>
      <h2>Antisemitism</h2>
    </article>
    <article class="museum-era-panel museum-era-panel-live" id="antizionism">
      <div class="museum-era-number">III</div>
      <img class="site-image pending-image" src="campus_encampment.webp" alt="Antizionism archive image" loading="lazy" decoding="async"/>
      <h2>Antizionism</h2>
      <a class="museum-enter-room" href="antizionism.html">Enter Room III</a>
    </article>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
