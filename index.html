<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop Antizionism</title>
<!-- v44: kinetic triptych not boring -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f6f4ef;
  --panel: #ffffff;
  --ink: #101316;
  --muted: rgba(16,19,22,.54);
  --line: rgba(16,19,22,.16);
  --line-strong: rgba(16,19,22,.34);
  --shadow: rgba(20,24,28,.10);
  --ease: cubic-bezier(.16,.82,.18,1);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--paper);
  color: var(--ink);
}

body {
  font-family: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
  text-rendering: geometricPrecision;
}

button {
  font: inherit;
}

.site {
  min-height: 100vh;
  width: 100vw;
  position: relative;
  background: var(--paper);
}

.hero {
  min-height: 100vh;
  width: min(1160px, 90vw);
  margin: 0 auto;
  display: grid;
  align-content: center;
  justify-items: center;
}

.hero-rule {
  width: min(780px, 70vw);
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(16,19,22,.22), transparent);
  transform-origin: center;
  transform: scaleX(0);
  animation: ruleDraw 1600ms var(--ease) 200ms both;
}

.primary-card {
  position: relative;
  width: min(500px, 74vw);
  height: 158px;
  margin-top: 58px;
  border: 1px solid var(--line);
  background: #fff;
  display: grid;
  place-items: center;
  opacity: 0;
  transform: translateY(14px);
  animation: primaryArrive 4000ms linear both;
  box-shadow: 0 18px 52px rgba(20,24,28,.055);
}

.primary-card::before {
  content: "";
  position: absolute;
  inset: -1px;
  border: 1px solid var(--line-strong);
  clip-path: inset(0 100% 0 0);
  animation: frameDraw 4000ms linear both;
  pointer-events: none;
}

.primary-title,
.era-card span,
.room-title,
.gallery-card strong,
.detail-title {
  font-family: "Instrument Serif", "Cormorant Garamond", Georgia, serif;
  font-weight: 400;
  letter-spacing: .002em;
}

.primary-title {
  font-size: clamp(3rem, 5.7vw, 5.6rem);
  line-height: .86;
  opacity: 0;
  filter: blur(8px);
  animation: textArrive 4000ms linear both;
}

.era-row {
  width: min(980px, 90vw);
  margin-top: 96px;
  display: grid;
  grid-template-columns: repeat(3, minmax(190px, 1fr));
  gap: clamp(22px, 4vw, 56px);
}

.era-card {
  height: 128px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  opacity: 0;
  transform: translateY(14px);
  cursor: pointer;
  transition:
    border-color 420ms var(--ease),
    box-shadow 420ms var(--ease),
    transform 420ms var(--ease);
  animation: eraArrive 2500ms linear both;
  animation-delay: var(--delay);
}

.era-card:nth-child(1) { --delay: 4000ms; }
.era-card:nth-child(2) { --delay: 6500ms; }
.era-card:nth-child(3) { --delay: 9000ms; }

.era-card span {
  display: block;
  font-size: clamp(1.85rem, 3.25vw, 3rem);
  line-height: 1;
}

.era-card:hover,
.era-card:focus-visible {
  outline: none;
  border-color: var(--line-strong);
  transform: translateY(-3px);
  box-shadow: 0 18px 48px rgba(20,24,28,.10);
}

.sound {
  position: fixed;
  right: 28px;
  bottom: 24px;
  z-index: 20;
  width: 22px;
  height: 22px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  padding: 0;
  cursor: pointer;
}

.sound::before {
  content: "";
  position: absolute;
  inset: 7px;
  border-radius: 999px;
  background: rgba(16,19,22,.40);
}

.sound.on::before {
  background: rgba(16,19,22,.86);
}

.chapter {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: var(--paper);
  opacity: 0;
  pointer-events: none;
  transition: opacity 520ms var(--ease);
  overflow: auto;
}

.chapter.open {
  opacity: 1;
  pointer-events: auto;
}

.room {
  width: min(1190px, 90vw);
  min-height: 100vh;
  margin: 0 auto;
  padding: clamp(54px, 7vh, 78px) 0 clamp(58px, 8vh, 86px);
}

.room-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 28px;
}

.room-title {
  margin: 0;
  font-size: clamp(3.2rem, 6vw, 6.2rem);
  line-height: .84;
}

.back,
.detail-close {
  width: 34px;
  height: 34px;
  border: 1px solid var(--line);
  background: #fff;
  color: rgba(16,19,22,.72);
  padding: 0;
  cursor: pointer;
  font-size: 1.1rem;
  line-height: 1;
}

.back:hover,
.back:focus-visible,
.detail-close:hover,
.detail-close:focus-visible {
  outline: none;
  border-color: var(--line-strong);
  box-shadow: 0 10px 24px rgba(20,24,28,.08);
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(34px, 4vw, 64px);
  margin-top: clamp(58px, 8vh, 86px);
  align-items: start;
}

.gallery-card {
  min-height: 560px;
  background: transparent;
  border: 0;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  padding: 0;
  transition: transform 420ms var(--ease);
}

.gallery-frame {
  width: 100%;
  height: clamp(390px, 52vh, 470px);
  background: #fff;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  padding: clamp(16px, 2vw, 26px);
  box-shadow: 0 12px 38px rgba(20,24,28,.045);
  transition:
    border-color 420ms var(--ease),
    box-shadow 420ms var(--ease),
    transform 420ms var(--ease),
    filter 420ms var(--ease);
}

.gallery-frame img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.gallery-card strong {
  display: block;
  margin-top: 28px;
  font-size: clamp(2.1rem, 3.35vw, 3.35rem);
  line-height: .9;
}

.gallery-card:hover,
.gallery-card:focus-visible,
.gallery-card.is-hover {
  outline: none;
  transform: translateY(-4px);
}

.gallery-card:hover .gallery-frame,
.gallery-card:focus-visible .gallery-frame,
.gallery-card.is-hover .gallery-frame {
  border-color: var(--line-strong);
  box-shadow: 0 22px 68px rgba(20,24,28,.12);
  filter: brightness(1.025);
}

.empty-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(34px, 4vw, 64px);
  margin-top: clamp(58px, 8vh, 86px);
}

.empty-card {
  height: clamp(390px, 52vh, 470px);
  background: #fff;
  border: 1px solid var(--line);
}

.detail {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(246,244,239,.94);
  opacity: 0;
  pointer-events: none;
  transition: opacity 360ms var(--ease);
  display: grid;
  place-items: center;
  padding: 4vw;
}

.detail.open {
  opacity: 1;
  pointer-events: auto;
}

.detail-panel {
  width: min(1050px, 92vw);
  min-height: min(650px, 88vh);
  background: #fff;
  border: 1px solid var(--line);
  box-shadow: 0 34px 90px rgba(20,24,28,.13);
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(210px, .35fr);
  gap: clamp(30px, 4vw, 56px);
  padding: clamp(26px, 4vw, 48px);
  transform: translateY(14px);
  transition: transform 360ms var(--ease);
}

.detail.open .detail-panel {
  transform: translateY(0);
}

.detail-image-wrap {
  border: 1px solid var(--line);
  background: #fff;
  padding: clamp(14px, 2vw, 22px);
  display: grid;
  place-items: center;
  min-height: 510px;
}

.detail-image-wrap img {
  width: 100%;
  height: 100%;
  max-height: 570px;
  object-fit: contain;
  display: block;
}

.detail-side {
  display: grid;
  align-content: start;
  gap: 30px;
}

.detail-side-top {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: start;
}

.detail-title {
  margin: 0;
  font-size: clamp(3rem, 5.2vw, 5.4rem);
  line-height: .85;
}

.page-wipe {
  position: fixed;
  inset: 0;
  z-index: 30;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.94), transparent);
}

.page-wipe.active {
  animation: wipe 760ms var(--ease) both;
}

@keyframes ruleDraw {
  to { transform: scaleX(1); }
}

@keyframes primaryArrive {
  0% { opacity: 0; transform: translateY(16px); }
  25% { opacity: .22; }
  50% { opacity: .52; transform: translateY(8px); }
  75% { opacity: .84; transform: translateY(3px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes frameDraw {
  0% { clip-path: inset(0 100% 0 0); }
  25% { clip-path: inset(0 72% 0 0); }
  50% { clip-path: inset(0 42% 0 0); }
  75% { clip-path: inset(0 14% 0 0); }
  100% { clip-path: inset(0 0 0 0); }
}

@keyframes textArrive {
  0%, 48% { opacity: 0; filter: blur(8px); transform: translateY(8px); }
  72% { opacity: .58; filter: blur(3px); }
  100% { opacity: 1; filter: blur(0); transform: translateY(0); }
}

@keyframes eraArrive {
  0% { opacity: 0; transform: translateY(14px); filter: blur(7px); }
  35% { opacity: .28; }
  70% { opacity: .72; filter: blur(2px); }
  100% { opacity: 1; transform: translateY(0); filter: blur(0); }
}

@keyframes wipe {
  0% { opacity: 0; transform: translateX(-38%); }
  35% { opacity: 1; }
  100% { opacity: 0; transform: translateX(38%); }
}

@media (max-width: 900px) {
  body { overflow: auto; }
  .hero { min-height: 100vh; padding: 80px 0; }
  .era-row,
  .gallery-grid,
  .empty-grid,
  .detail-panel {
    grid-template-columns: 1fr;
  }
  .chapter {
    overflow: auto;
  }
  .gallery-card {
    min-height: auto;
  }
  .gallery-frame,
  .empty-card {
    height: 360px;
  }
  .detail-image-wrap {
    min-height: 360px;
  }
}

/* v39: professional motion. Not decorative; movement guides attention. */
.motion-site::before {
  content: "";
  position: fixed;
  inset: -18%;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(circle at 28% 20%, rgba(255,255,255,.72), transparent 26rem),
    radial-gradient(circle at 78% 14%, rgba(230,226,214,.32), transparent 30rem);
  opacity: .72;
  animation: ambientDrift 18s ease-in-out infinite alternate;
}

.site,
.chapter,
.detail {
  z-index: 1;
}

.room {
  position: relative;
}

.room::before {
  content: "";
  position: absolute;
  left: -34px;
  top: 72px;
  bottom: 86px;
  width: 1px;
  background: rgba(16,19,22,.12);
  transform-origin: top;
  transform: scaleY(0);
}

.room::after {
  content: "";
  position: absolute;
  left: -34px;
  top: 72px;
  width: 1px;
  height: 92px;
  background: linear-gradient(180deg, transparent, rgba(16,19,22,.36), transparent);
  opacity: 0;
  transform: translateY(0);
}

.chapter.open .room::before {
  animation: spineDraw 1100ms var(--ease) 160ms both;
}

.chapter.open .room::after {
  animation: spinePass 3600ms var(--ease) 900ms both;
}

.chapter.open .room-title {
  animation: roomTitleIn 900ms var(--ease) both;
}

.gallery-rail {
  width: 100%;
  height: 1px;
  margin-top: clamp(40px, 6vh, 64px);
  background: linear-gradient(90deg, rgba(16,19,22,.05), rgba(16,19,22,.22), rgba(16,19,22,.05));
  transform-origin: left;
  transform: scaleX(0);
  opacity: 0;
}

.chapter.open .gallery-rail {
  animation: railDraw 1250ms var(--ease) 360ms both;
}

.gallery-grid,
.empty-grid {
  margin-top: clamp(34px, 5vh, 54px);
}

.chapter.open .gallery-card,
.chapter.open .empty-card {
  opacity: 0;
  animation: artEnter 1450ms var(--ease) both;
}

.chapter.open .gallery-card:nth-child(1),
.chapter.open .empty-card:nth-child(1) {
  animation-delay: 420ms;
}

.chapter.open .gallery-card:nth-child(2),
.chapter.open .empty-card:nth-child(2) {
  animation-delay: 620ms;
}

.chapter.open .gallery-card:nth-child(3),
.chapter.open .empty-card:nth-child(3) {
  animation-delay: 820ms;
}

.gallery-frame {
  position: relative;
  overflow: hidden;
  transform: translateY(0);
}

.gallery-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(105deg, transparent 0 42%, rgba(255,255,255,.34) 50%, transparent 60% 100%);
  transform: translateX(-130%);
  opacity: 0;
}

.chapter.open .gallery-card .gallery-frame::after {
  animation: inspectionPass 1600ms var(--ease) both;
}

.chapter.open .gallery-card:nth-child(1) .gallery-frame::after { animation-delay: 850ms; }
.chapter.open .gallery-card:nth-child(2) .gallery-frame::after { animation-delay: 1050ms; }
.chapter.open .gallery-card:nth-child(3) .gallery-frame::after { animation-delay: 1250ms; }

.gallery-frame img {
  transition:
    transform 460ms var(--ease),
    filter 460ms var(--ease);
  transform:
    translate3d(calc(var(--card-x, 0) * 8px), calc(var(--card-y, 0) * 8px), 0)
    scale(1.012);
}

.gallery-card:hover .gallery-frame img,
.gallery-card:focus-visible .gallery-frame img,
.gallery-card.is-hover .gallery-frame img {
  transform:
    translate3d(calc(var(--card-x, 0) * 12px), calc(var(--card-y, 0) * 12px), 0)
    scale(1.035);
  filter: brightness(1.035) contrast(1.018);
}

.gallery-card:hover .gallery-frame,
.gallery-card:focus-visible .gallery-frame,
.gallery-card.is-hover .gallery-frame {
  transform: translateY(-3px);
}

.detail.open .detail-panel {
  animation: detailRise 520ms var(--ease) both;
}

.detail.open .detail-image-wrap img {
  animation: detailImageIn 720ms var(--ease) 80ms both;
}

@keyframes ambientDrift {
  0% { transform: translate3d(-1.2%, -.8%, 0) scale(1); }
  100% { transform: translate3d(1.2%, .8%, 0) scale(1.018); }
}

@keyframes spineDraw {
  to { transform: scaleY(1); }
}

@keyframes spinePass {
  0% { opacity: 0; transform: translateY(0); }
  20% { opacity: .95; }
  100% { opacity: 0; transform: translateY(66vh); }
}

@keyframes railDraw {
  0% { opacity: 0; transform: scaleX(0); }
  18% { opacity: 1; }
  100% { opacity: 1; transform: scaleX(1); }
}

@keyframes roomTitleIn {
  0% { opacity: 0; transform: translateY(16px); filter: blur(6px); }
  100% { opacity: 1; transform: translateY(0); filter: blur(0); }
}

@keyframes artEnter {
  0% { opacity: 0; transform: translateY(34px) scale(.982); filter: blur(10px); }
  54% { opacity: .72; filter: blur(3px); }
  100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

@keyframes inspectionPass {
  0% { opacity: 0; transform: translateX(-130%); }
  18% { opacity: .72; }
  100% { opacity: 0; transform: translateX(130%); }
}

@keyframes detailRise {
  0% { opacity: 0; transform: translateY(22px) scale(.986); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes detailImageIn {
  0% { opacity: 0; transform: translateY(14px) scale(.985); filter: blur(6px); }
  100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

@media (prefers-reduced-motion: reduce) {
  .motion-site::before,
  .chapter.open .room::before,
  .chapter.open .room::after,
  .chapter.open .room-title,
  .chapter.open .gallery-rail,
  .chapter.open .gallery-card,
  .chapter.open .empty-card,
  .chapter.open .gallery-card .gallery-frame::after,
  .detail.open .detail-panel,
  .detail.open .detail-image-wrap img {
    animation: none !important;
  }
  .gallery-card,
  .empty-card,
  .gallery-rail {
    opacity: 1 !important;
    transform: none !important;
  }
}


/* v40: hover zoom inspection system */
.gallery-grid {
  isolation: isolate;
}

.gallery-card {
  position: relative;
  z-index: 1;
  will-change: transform, opacity;
}

.gallery-grid:hover .gallery-card,
.gallery-grid:focus-within .gallery-card {
  opacity: .46;
  transform: scale(.985);
}

.gallery-grid:hover .gallery-card:hover,
.gallery-grid:focus-within .gallery-card:focus-visible,
.gallery-card.is-hover {
  opacity: 1;
  z-index: 8;
  transform: translateY(-12px) scale(1.02);
}

.gallery-card .gallery-frame {
  transform-origin: center center;
  will-change: transform, box-shadow, filter;
}

.gallery-grid:hover .gallery-card:hover .gallery-frame,
.gallery-grid:focus-within .gallery-card:focus-visible .gallery-frame,
.gallery-card.is-hover .gallery-frame {
  transform:
    translate3d(calc(var(--card-x, 0) * 14px), calc(var(--card-y, 0) * 14px - 16px), 0)
    scale(1.22);
  box-shadow: 0 34px 95px rgba(20,24,28,.20);
  border-color: rgba(16,19,22,.42);
  filter: brightness(1.035) contrast(1.018);
}

.gallery-grid:hover .gallery-card:hover .gallery-frame img,
.gallery-grid:focus-within .gallery-card:focus-visible .gallery-frame img,
.gallery-card.is-hover .gallery-frame img {
  transform:
    translate3d(calc(var(--card-x, 0) * 18px), calc(var(--card-y, 0) * 18px), 0)
    scale(1.035);
}

.gallery-grid:hover .gallery-card:hover strong,
.gallery-grid:focus-within .gallery-card:focus-visible strong,
.gallery-card.is-hover strong {
  transform: translateY(18px);
  opacity: .96;
}

.gallery-card strong {
  transition:
    transform 500ms var(--ease),
    opacity 500ms var(--ease);
}

/* prevent zoom clipping on the edge cards */
.gallery-card:first-child .gallery-frame {
  transform-origin: center left;
}

.gallery-card:last-child .gallery-frame {
  transform-origin: center right;
}

@media (max-width: 900px) {
  .gallery-grid:hover .gallery-card,
  .gallery-grid:focus-within .gallery-card {
    opacity: 1;
    transform: none;
  }

  .gallery-grid:hover .gallery-card:hover .gallery-frame,
  .gallery-grid:focus-within .gallery-card:focus-visible .gallery-frame,
  .gallery-card.is-hover .gallery-frame {
    transform: translateY(-8px) scale(1.045);
  }
}


/* v41: stronger homepage-to-gallery transition and mobile polish */
.hero::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 58px;
  width: min(720px, 64vw);
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(16,19,22,.24), transparent);
  transform: translateX(-50%) scaleX(0);
  transform-origin: center;
  opacity: 0;
  animation: lowerRuleIn 1200ms var(--ease) 11000ms both;
}

.era-card::after {
  content: "";
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 18px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(16,19,22,.28), transparent);
  transform: scaleX(0);
  transform-origin: center;
  transition: transform 520ms var(--ease);
}

.era-card {
  position: relative;
  overflow: hidden;
}

.era-card:hover::after,
.era-card:focus-visible::after {
  transform: scaleX(1);
}

.site.entering-room .hero {
  animation: heroExit 520ms var(--ease) both;
}

.page-wipe.active {
  background:
    linear-gradient(90deg, transparent, rgba(255,255,255,.98), transparent),
    linear-gradient(180deg, rgba(246,244,239,0), rgba(246,244,239,.9));
}

.gallery-card {
  transition:
    transform 520ms var(--ease),
    opacity 520ms var(--ease);
}

.gallery-frame {
  backface-visibility: hidden;
}

.detail-panel {
  max-height: 88vh;
  overflow: auto;
}

@keyframes lowerRuleIn {
  0% { opacity: 0; transform: translateX(-50%) scaleX(0); }
  25% { opacity: 1; }
  100% { opacity: 1; transform: translateX(-50%) scaleX(1); }
}

@keyframes heroExit {
  0% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  100% { opacity: .26; transform: translateY(-14px) scale(.986); filter: blur(5px); }
}

/* Mobile: hover effects removed; tap opens full image detail cleanly. */
@media (max-width: 900px) {
  body {
    overflow: auto;
  }

  .site {
    min-height: 100svh;
  }

  .hero {
    width: min(100% - 34px, 620px);
    padding: 54px 0 64px;
    min-height: 100svh;
  }

  .hero-rule {
    width: min(420px, 76vw);
  }

  .primary-card {
    width: min(420px, 86vw);
    height: 132px;
    margin-top: 44px;
  }

  .primary-title {
    font-size: clamp(2.8rem, 13vw, 4.7rem);
  }

  .era-row {
    width: min(420px, 86vw);
    margin-top: 70px;
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .era-card {
    height: 96px;

      <div class="detail-side-top">
        <h2 class="detail-title" id="detailTitle"></h2>
        <button class="detail-close" type="button" id="detailClose" aria-label="Close">×</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const audio = document.getElementById('siteMusic');
  const sound = document.getElementById('sound');
  const wipe = document.getElementById('pageWipe');
  const detail = document.getElementById('detail');
  const detailImage = document.getElementById('detailImage');
  const detailTitle = document.getElementById('detailTitle');
  const detailClose = document.getElementById('detailClose');
  const chapters = Array.from(document.querySelectorAll('.chapter'));
  const openers = Array.from(document.querySelectorAll('[data-open]'));
  const closers = Array.from(document.querySelectorAll('[data-close]'));
  const galleryCards = Array.from(document.querySelectorAll('[data-detail]'));
  let musicStarted = false;

  function closeDetail() {
    if (!detail) return;
    detail.classList.remove('open');
    detail.setAttribute('aria-hidden', 'true');
  }

  function closeChapters() {
    closeDetail();
    chapters.forEach(chapter => {
      chapter.classList.remove('open');
      chapter.setAttribute('aria-hidden', 'true');
    });
  }

  function openChapter(id, immediate) {
    const chapter = document.getElementById('chapter-' + id);
    const siteRoot = document.getElementById('siteRoot');
    if (!chapter) return;

    if (!immediate && siteRoot) {
      siteRoot.classList.add('entering-room');
    }

    if (!immediate && wipe) {
      wipe.classList.remove('active');
      void wipe.offsetWidth;
      wipe.classList.add('active');
    }

    window.setTimeout(() => {
      closeChapters();
      chapter.classList.add('open');
      chapter.setAttribute('aria-hidden', 'false');
      if (siteRoot) siteRoot.classList.remove('entering-room');
    }, immediate ? 0 : 320);
  }

  function openDetail(card) {
    if (!detail || !detailImage || !detailTitle) return;
    const img = card.querySelector('img');
    const title = card.dataset.detail || '';
    if (img) detailImage.src = img.src;
    detailTitle.textContent = title;
    detail.classList.add('open');
    detail.setAttribute('aria-hidden', 'false');
  }

  async function unlockMusic() {
    if (!audio || musicStarted) return;
    try {
      audio.volume = 0.42;
      audio.muted = false;
      await audio.play();
      musicStarted = true;
      if (sound) sound.classList.add('on');
    } catch (e) {
      if (sound) sound.classList.remove('on');
    }
  }

  async function primeMusic() {
    if (!audio) return;
    try {
      audio.volume = 0.42;
      audio.muted = true;
      await audio.play();
    } catch (e) {}
  }

  openers.forEach(button => {
    button.addEventListener('click', () => {
      unlockMusic();
      openChapter(button.dataset.open);
    });
  });

  closers.forEach(button => button.addEventListener('click', closeChapters));
  galleryCards.forEach(card => {
    card.addEventListener('click', () => openDetail(card));
    card.addEventListener('mousemove', event => {
      const rect = card.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width - 0.5).toFixed(3);
      const y = ((event.clientY - rect.top) / rect.height - 0.5).toFixed(3);
      card.style.setProperty('--card-x', x);
      card.style.setProperty('--card-y', y);
    });
    card.addEventListener('mouseleave', () => {
      card.style.setProperty('--card-x', '0');
      card.style.setProperty('--card-y', '0');
    });
  });
  if (detailClose) detailClose.addEventListener('click', closeDetail);
  if (detail) detail.addEventListener('click', event => { if (event.target === detail) closeDetail(); });

  if (sound) {
    sound.addEventListener('click', () => {
      if (!audio) return;
      if (musicStarted && !audio.paused) {
        audio.pause();
        musicStarted = false;
        sound.classList.remove('on');
      } else {
        unlockMusic();
      }
    });
  }

  document.addEventListener('pointerdown', unlockMusic);
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      if (detail && detail.classList.contains('open')) closeDetail();
      else closeChapters();
    }
    unlockMusic();
  });

  const params = new URLSearchParams(window.location.search);
  const room = params.get('room');
  const hover = params.get('hover');
  const detailParam = params.get('detail');

  if (room) openChapter(room, true);

  if (hover) {
    const target = galleryCards.find(card => (card.dataset.detail || '').toLowerCase() === hover.toLowerCase());
    if (target) target.classList.add('is-hover');
  }

  if (detailParam) {
    const target = galleryCards.find(card => (card.dataset.detail || '').toLowerCase() === detailParam.toLowerCase());
    if (target) window.setTimeout(() => openDetail(target), 80);
  }

  primeMusic();
})();
</script>
</body>
</html>
