<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STOPAZ</title>
<style>
:root{--bg:#15110e;--panel:#211a15;--ink:#f5eadb;--muted:#b8a895;--red:#8f1c16;--shadow:rgba(0,0,0,.58);--ease:cubic-bezier(.2,.75,.2,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{font-family:Georgia,"Times New Roman",serif;overflow:hidden}button{font:inherit;color:inherit}.stage{min-height:100svh;position:relative;isolation:isolate;padding:clamp(18px,3vw,40px)}
.stage::before{content:"";position:fixed;inset:-8%;z-index:-3;background:linear-gradient(rgba(18,14,11,.70),rgba(18,14,11,.84)),url('timeline.webp') center/cover no-repeat;filter:saturate(.75) contrast(1.08);transform:scale(1.06);animation:projector 22s ease-in-out infinite alternate}.stage::after{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% 28%,transparent 0 22%,rgba(0,0,0,.28) 68%,rgba(0,0,0,.62) 100%),linear-gradient(90deg,rgba(0,0,0,.34),transparent 18% 82%,rgba(0,0,0,.34));pointer-events:none}.topbar{display:flex;justify-content:space-between;align-items:center;max-width:1480px;margin:0 auto 18px;position:relative;z-index:5}.back,.music{border:1px solid rgba(245,234,219,.45);background:rgba(16,12,10,.76);box-shadow:0 10px 28px var(--shadow);padding:10px 14px;cursor:pointer;min-width:76px}.back{font-family:Arial,sans-serif;font-size:20px;line-height:1}.music{display:flex;align-items:center;gap:9px}.bars{display:flex;gap:3px;align-items:flex-end;height:16px}.bars i{display:block;width:3px;background:currentColor;height:6px}.music.playing .bars i{animation:bars .8s ease-in-out infinite alternate}.music.playing .bars i:nth-child(2){animation-delay:.18s}.music.playing .bars i:nth-child(3){animation-delay:.35s}
.room{max-width:1480px;margin:0 auto;min-height:calc(100svh - 104px);display:flex;align-items:center}.bays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,1.8vw,28px);width:100%;align-items:stretch}.bay{position:relative;min-height:min(72vh,760px);border:1px solid rgba(245,234,219,.36);background:#0d0b09;box-shadow:0 28px 70px var(--shadow),inset 0 0 0 10px rgba(255,255,255,.035);overflow:hidden;cursor:pointer;transition:flex .5s var(--ease),transform .5s var(--ease),opacity .5s var(--ease),filter .5s var(--ease),box-shadow .5s var(--ease);transform-origin:center}.bay img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.92) contrast(1.12) brightness(.83);transition:transform .7s var(--ease),filter .5s var(--ease)}.bay::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(0,0,0,.2) 66%,rgba(0,0,0,.82) 100%);pointer-events:none}.label{position:absolute;left:0;right:0;bottom:0;z-index:2;text-align:center;padding:24px 16px 28px;font-size:clamp(2.7rem,4.8vw,5.4rem);line-height:.9;letter-spacing:-.045em;text-shadow:0 5px 28px #000}.bays:has(.bay:hover) .bay:not(:hover){opacity:.48;filter:saturate(.55)}.bay:hover{transform:scale(1.035);z-index:3;box-shadow:0 36px 100px rgba(0,0,0,.7),0 0 0 1px rgba(245,234,219,.6)}.bay:hover img{transform:scale(1.035);filter:saturate(1) contrast(1.15) brightness(.95)}
.detail{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:clamp(16px,3vw,42px);background:rgba(7,6,5,.92)}.detail.open{display:grid}.detail figure{margin:0;max-width:min(92vw,1320px);max-height:88vh;position:relative}.detail img{max-width:100%;max-height:88vh;display:block;object-fit:contain;box-shadow:0 35px 100px #000;border:1px solid rgba(245,234,219,.38)}.close{position:fixed;top:18px;right:18px;z-index:22;width:48px;height:48px;border:1px solid rgba(245,234,219,.55);background:#17120f;cursor:pointer;font:32px/1 Arial,sans-serif}.detail-label{position:absolute;left:16px;bottom:14px;font-size:clamp(2rem,5vw,5rem);text-shadow:0 4px 18px #000}
@keyframes projector{from{transform:scale(1.06) translate3d(-1.2%,0,0)}to{transform:scale(1.1) translate3d(1.2%,-.6%,0)}}@keyframes bars{to{height:16px}}
@media(max-width:820px){body{overflow-x:hidden;overflow-y:auto}.stage{padding:14px}.room{align-items:flex-start}.bays{grid-template-columns:1fr;gap:14px}.bay{min-height:56vh}.label{font-size:clamp(3rem,15vw,5rem);padding-bottom:22px}.bays:has(.bay:hover) .bay:not(:hover){opacity:1;filter:none}.bay:hover{transform:none}.topbar{margin-bottom:14px}.back{visibility:hidden}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.stage::before{transform:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="topbar">
    <button class="back" type="button" aria-label="Back">←</button>
    <button class="music" type="button" aria-pressed="false"><span>Music</span><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span></button>
  </div>
  <main class="room">
    <section class="bays" aria-label="Antizionism room">
      <button class="bay" type="button" data-label="Soviet" data-image="soviet_horses.webp"><img src="soviet_horses.webp" alt=""><span class="label">Soviet</span></button>
      <button class="bay" type="button" data-label="Arab" data-image="arab_red_hands.webp"><img src="arab_red_hands.webp" alt=""><span class="label">Arab</span></button>
      <button class="bay" type="button" data-label="Western" data-image="campus_encampment.webp"><img src="campus_encampment.webp" alt=""><span class="label">Western</span></button>
    </section>
  </main>
</div>
<div class="detail" role="dialog" aria-modal="true" aria-hidden="true">
  <button class="close" type="button" aria-label="Close">×</button>
  <figure><img alt=""><figcaption class="detail-label"></figcaption></figure>
</div>
<audio id="audio" preload="auto" loop src="nocturne.mp3"></audio>
<script>
const detail=document.querySelector('.detail');
const detailImg=detail.querySelector('img');
const detailLabel=detail.querySelector('.detail-label');
const closeBtn=document.querySelector('.close');
const backBtn=document.querySelector('.back');
const musicBtn=document.querySelector('.music');
const audio=document.querySelector('#audio');
let lastFocus=null;
function openDetail(bay){lastFocus=bay;detailImg.src=bay.dataset.image;detailLabel.textContent=bay.dataset.label;detail.classList.add('open');detail.setAttribute('aria-hidden','false');closeBtn.focus();}
function closeDetail(){detail.classList.remove('open');detail.setAttribute('aria-hidden','true');detailImg.removeAttribute('src');if(lastFocus)lastFocus.focus();}
document.querySelectorAll('.bay').forEach(bay=>bay.addEventListener('click',()=>openDetail(bay)));
closeBtn.addEventListener('click',closeDetail);
detail.addEventListener('click',e=>{if(e.target===detail)closeDetail();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&detail.classList.contains('open'))closeDetail();});
backBtn.addEventListener('click',()=>{if(detail.classList.contains('open'))closeDetail();else if(history.length>1)history.back();});
musicBtn.addEventListener('click',async()=>{try{if(audio.paused){await audio.play();musicBtn.classList.add('playing');musicBtn.setAttribute('aria-pressed','true');}else{audio.pause();musicBtn.classList.remove('playing');musicBtn.setAttribute('aria-pressed','false');}}catch(err){musicBtn.classList.remove('playing');musicBtn.setAttribute('aria-pressed','false');}});
</script>
</body>
</html>
